<!-- ========== HEADER / NAVIGATION ========== -->
<header class="main-header" id="mainHeader">
    <div class="container">
        <div class="header-inner flex-between">
            <a href="index.html" class="brand">
                <img src="logo.png" alt="HOLGENVY" class="brand-logo">
                <div class="brand-text">
                    <span class="brand-name">HOLGENVY</span>
                    <span class="brand-tag">HARDWARE TOOLS</span>
                </div>
            </a>
            <div class="search-bar" id="searchBar">
                <input type="text" id="searchInput" placeholder="Search for tools, drills, wrenches...">
                <button class="search-btn" id="searchBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="header-actions">
                <a href="inquiry.html" class="action-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <span>Inquiry</span>
                    <span class="cart-badge" id="inquiryBadge">0</span>
                </a>
            </div>
            <button class="mobile-toggle" id="mobileToggle">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
</header>
