<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | HOLGENVY - Professional Hardware & Electric Tools</title>
    <meta name="description" content="Industry insights, sourcing guides, and product spotlights from HOLGENVY. Stay informed about power tools and hardware trends.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .blog-loading { text-align: center; padding: 80px 20px; }
        .blog-loading .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--neon); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .blog-empty { text-align: center; padding: 80px 20px; color: var(--text-muted); }
        .blog-empty svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.4; }
        .blog-empty h3 { font-size: 1.2rem; margin-bottom: 8px; color: var(--text-secondary); }
        .blog-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 32px; }
        .blog-filter-btn { padding: 8px 18px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: var(--transition); }
        .blog-filter-btn:hover { border-color: var(--neon); color: var(--text); }
        .blog-filter-btn.active { background: var(--neon); color: #fff; border-color: var(--neon); }
        .blog-pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 48px; }
        .blog-pagination button { width: 40px; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; }
        .blog-pagination button:hover:not(:disabled) { border-color: var(--neon); color: var(--neon); }
        .blog-pagination button.active { background: var(--neon); color: #fff; border-color: var(--neon); }
        .blog-pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
        .blog-card-author { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--text-muted); }
        .blog-card-author .author-avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--neon); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 700; }
    </style>
</head>
<body>

    <!-- ========== HEADER (loaded via JS) ========== -->
    <div id="site-header"></div>

    <!-- ========== CATEGORY NAV (loaded via JS) ========== -->
    <div id="site-nav"></div>

    <!-- ========== BLOG HERO ========== -->
    <section class="page-header">
        <div class="container">
            <h1>HOLGENVY <span class="neon">Blog</span></h1>
            <p>Industry insights, sourcing guides, and product spotlights to help you make informed decisions.</p>
        </div>
    </section>

    <!-- ========== BLOG LIST PAGE ========== -->
    <section class="blog-list-page">
        <div class="container">

            <!-- Category Filters -->
            <div class="blog-filters" id="blogFilters">
                <button class="blog-filter-btn active" data-category="">All</button>
                <button class="blog-filter-btn" data-category="industry-trends">Industry Trends</button>
                <button class="blog-filter-btn" data-category="sourcing-guide">Sourcing Guide</button>
                <button class="blog-filter-btn" data-category="product-spotlight">Product Spotlight</button>
                <button class="blog-filter-btn" data-category="technical">Technical</button>
                <button class="blog-filter-btn" data-category="product-guide">Product Guide</button>
            </div>

            <!-- Blog Grid (dynamically loaded) -->
            <div class="blog-page-grid" id="blogGrid">
                <div class="blog-loading">
                    <div class="spinner"></div>
                    <p>Loading articles...</p>
                </div>
            </div>

            <!-- Pagination -->
            <div class="blog-pagination" id="blogPagination"></div>

        </div>
    </section>

    <!-- ========== FOOTER (loaded via JS) ========== -->
    <div id="site-footer"></div>

    <script src="script.js?v=2"></script>
</body>
</html>
